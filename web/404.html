<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없음 · 델타포스 건스미스</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg: #0e1517; --line: rgba(255,255,255,.12); --fg: #e3e9e9; --dim: #9aa6a7; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--fg);
    font: 15px/1.7 "Noto Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
  main { text-align: center; max-width: 420px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
  p { color: var(--dim); margin: 0 0 24px; }
  a { display: inline-block; padding: 8px 18px; border: 1px solid var(--line); color: var(--fg); text-decoration: none; }
  a:hover { border-color: rgba(255,255,255,.5); }
</style>
</head>
<body>
<main>
  <h1>페이지를 찾을 수 없어요</h1>
  <p>주소가 바뀌었거나 없는 페이지예요.<br>Page not found.</p>
  <a href="/">건스미스로 가기 / Go to Gunsmith</a>
</main>
</body>
</html>
